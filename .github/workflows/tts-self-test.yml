name: TTS Self Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile bot.py pronunciation.py

      - name: Test pronunciation filters
        run: |
          python - <<'PY'
          from pronunciation import choose_rate, prepare_for_tts
          from bot import edge_rate

          assert edge_rate(1.08) == "+8%"
          assert edge_rate(1.10) == "+10%"

          text = "DNK, sitoplazma, mitoxondriya, hujayra, g'isht."
          prepared = prepare_for_tts(text)

          assert "de-en-ka;" in prepared, prepared
          assert "si-toplazma;" in prepared, prepared
          assert "mi-to-xondriya;" in prepared, prepared
          assert "gʻisht" in prepared, prepared

          rate, level = choose_rate(
              "sitoplazma mitoxondriya hujayra ribosoma eritrotsit leykotsit"
          )
          assert rate == 1.00, (rate, level)
          assert level == "murakkab", level

          print("Prepared TTS text:")
          print(prepared)
          print("Rate checks: +8%, +10% OK")
          print("Medical smart-rate check: 1.00x / murakkab OK")
          PY

      - name: Edge TTS smoke test
        env:
          EDGE_VOICE: uz-UZ-MadinaNeural
        run: |
          python - <<'PY'
          import asyncio
          import os
          from pathlib import Path
          import edge_tts

          async def main():
              text = (
                  "DNK, sitoplazma, mitoxondriya, hujayra, "
                  "ribosoma va gʻisht. Sh ch ng."
              )
              out = Path("/tmp/tts-smoke.mp3")
              await edge_tts.Communicate(
                  text,
                  os.environ["EDGE_VOICE"],
                  rate="+10%",
              ).save(str(out))
              if not out.exists() or out.stat().st_size < 1024:
                  raise RuntimeError("TTS audio fayli yetarli hajmda yaratilmadi")
              print(f"TTS smoke test OK: {out.stat().st_size} bytes")
          asyncio.run(main())
          PY
