name: TTS Self Test

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Compile Python files
        run: python -m py_compile bot.py pronunciation.py

      - name: Test pronunciation filters
        run: |
          python - <<'PY'
          from pronunciation import choose_rate, normalize_text, prepare_for_tts
          from bot import edge_rate

          assert edge_rate(1.08) == "+8%"
          assert edge_rate(1.10) == "+10%"

          # 1) sh/ch/ng ga boy ro'yxat: aniq talaffuz uchun 0% tezlik.
          sound_list = (
              "Sh, ch va ng tovushlari: shifokor, shilliq, ichak, "
              "chaqaloq, kuchli, rang, tong, ko'ngil, singil."
          )
          sound_rate, sound_level = choose_rate(sound_list)
          assert sound_rate == 1.00, (sound_rate, sound_level)
          assert sound_level == "talaffuz", sound_level

          sound_prepared = prepare_for_tts(sound_list)
          assert "; va; " in sound_prepared, sound_prepared

          # Yakka oddiy gapdagi sh/ch/ng hali ham eski tezlik mantiqida qoladi.
          normal_sound_rate, normal_sound_level = choose_rate(
              "Shifokor bemorga dori berdi."
          )
          assert normal_sound_rate == 1.20, (
              normal_sound_rate,
              normal_sound_level,
          )

          # 2) Kutikulani qo'shimchali shaklda ham to'liq bo'g'inlarga ajratish.
          assert "ku-ti-ku-la-ni" in prepare_for_tts("kutikulani"), prepare_for_tts("kutikulani")

          # 3) Qisqartmalar.
          abbrev_prepared = prepare_for_tts(
              "DNK, RNK, ATP, AI, TTS, PDF, DOCX, TXT."
          )
          assert "de-en-ka" in abbrev_prepared, abbrev_prepared
          assert "er-en-ka" in abbrev_prepared, abbrev_prepared
          assert "a-te-pe" in abbrev_prepared, abbrev_prepared
          assert "a-i" in abbrev_prepared, abbrev_prepared
          assert "te-te-es" in abbrev_prepared, abbrev_prepared
          assert "pe-de-ef" in abbrev_prepared, abbrev_prepared
          assert "dok-eks" in abbrev_prepared, abbrev_prepared
          assert "te-iks-te" in abbrev_prepared, abbrev_prepared

          # 4) Lug'atda yo'q yangi tibbiy terminni avtomatik bo'g'inlash.
          new_term = "glomerulonefrit"
          new_term_prepared = prepare_for_tts(new_term)
          assert new_term_prepared == "glo-me-ru-lo-nef-rit", new_term_prepared
          new_term_rate, new_term_level = choose_rate(new_term)
          assert new_term_rate == 1.08, (new_term_rate, new_term_level)
          assert new_term_level == "termin", new_term_level

          # 5) Lug'atdagi terminning o'zbekcha qo'shimchalari ham avtomatik ulanadi.
          assert "ku-ti-ku-la-ning" in prepare_for_tts("kutikulaning")
          assert "nef-ron-lar" in prepare_for_tts("nefronlar")

          # 6) Oddiy uzun so'zlar ilmiy deb noto'g'ri qayta yozilmaydi.
          ordinary = "Universitet talabalarining ma'ruzalari tayyor."
          assert prepare_for_tts(ordinary) == normalize_text(ordinary), prepare_for_tts(ordinary)

          # Avvalgi tibbiy smart-rate saqlangan.
          rate, level = choose_rate(
              "sitoplazma mitoxondriya hujayra ribosoma eritrotsit leykotsit"
          )
          assert rate == 1.00, (rate, level)
          assert level == "murakkab", level

          print("SH/CH/NG rate:", sound_rate, sound_level)
          print("SH/CH/NG prepared:", sound_prepared)
          print("Kutikulani prepared:", prepare_for_tts("kutikulani"))
          print("Abbreviations prepared:", abbrev_prepared)
          print("New term:", new_term, "->", new_term_prepared, "|", new_term_rate, new_term_level)
          print("Morphology:", prepare_for_tts("kutikulaning"), "|", prepare_for_tts("nefronlar"))
          print("Ordinary text unchanged:", prepare_for_tts(ordinary))
          print("Rate checks: +8%, +10% OK")
          print("Existing medical smart-rate check: 1.00x / murakkab OK")
          PY

      - name: Edge TTS smoke test
        env:
          EDGE_VOICE: uz-UZ-MadinaNeural
        run: |
          python - <<'PY'
          import asyncio
          import os
          from pathlib import Path

          from bot import make_audio
          from pronunciation import prepare_for_tts

          async def main():
              source = (
                  "Sh, ch va ng tovushlari: shifokor, shilliq, ichak, "
                  "chaqaloq, kuchli, rang, tong, ko'ngil, singil. "
                  "Sitoplazma, mitoxondriya, ribosoma, vakuola, plastida, "
                  "xloroplast, kutikula, stroma. "
                  "DNK, RNK, ATP, AI, TTS, PDF, DOCX, TXT."
              )
              prepared = prepare_for_tts(source)
              print("Production TTS input:")
              print(prepared)

              out = Path("/tmp/tts-smoke.mp3")
              old_voice = os.environ.get("EDGE_VOICE")
              if old_voice != "uz-UZ-MadinaNeural":
                  raise RuntimeError("Kutilgan EDGE_VOICE topilmadi")

              await make_audio(source, 1.00, out)

              if not out.exists() or out.stat().st_size < 1024:
                  raise RuntimeError("TTS audio fayli yetarli hajmda yaratilmadi")

              print(f"Production make_audio smoke test OK: {out.stat().st_size} bytes")
          asyncio.run(main())
          PY
