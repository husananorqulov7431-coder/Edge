name: Telegram Bot
on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run bot for 5 minutes, then finish active work
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          EDGE_VOICE: uz-UZ-MadinaNeural
        run: |
          python bot.py &
          BOT_PID=$!

          # Botning asosiy faol ishlash oynasi — 5 daqiqa.
          sleep 300

          echo "5-minute window finished."
          echo "Graceful shutdown requested."

          # Telegram pollingni to'xtatish uchun signal.
          # Hozir bajarilayotgan Python/Edge-TTS operatsiyasi
          # yakunlanishiga imkon beriladi.
          kill -TERM "$BOT_PID" 2>/dev/null || true

          # Jarayon o'zini toza yopishini kutamiz.
          # Bu qo'shimcha yangi ish boshlamaydi; faqat mavjud ish tugashini kutadi.
          wait "$BOT_PID" || true

          echo "Bot and active work finished."
